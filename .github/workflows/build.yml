name: Build Noir x boost APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Tidak ada file .zip ditemukan di root repo."
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          unzip -o -q "$ZIP_FILE" -d extracted_project
          INNER=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          COUNT=$(find extracted_project -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -n "$INNER" ]; then
            mv "$INNER"/* extracted_project/
          fi
          echo "===== Isi hasil extract ====="
          find extracted_project -maxdepth 3

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: extracted-project
          path: extracted_project
          include-hidden-files: true

  build:
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - name: Download extracted project
        uses: actions/download-artifact@v4
        with:
          name: extracted-project
          path: extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses & install platform
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: extracted_project
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoirXBoost-debug-apk
          path: extracted_project/app/build/outputs/apk/debug/*.apk

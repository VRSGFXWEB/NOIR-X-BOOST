name: Extract Only

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files in repo root
        run: ls -la

      - name: Extract project zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          echo "File zip ditemukan: $ZIP_FILE"
          if [ -z "$ZIP_FILE" ]; then
            echo "TIDAK ADA file .zip di root repo ini."
            exit 1
          fi
          mkdir -p extracted_project
          unzip -o -q "$ZIP_FILE" -d extracted_project
          echo "===== Isi hasil extract ====="
          find extracted_project -maxdepth 3

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: extracted-project
          path: extracted_project
          include-hidden-files: true

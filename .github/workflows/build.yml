name: Extract To Code

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Tidak ada file .zip ditemukan di root repo."
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          unzip -o -q "$ZIP_FILE" -d /tmp/extracted
          INNER=$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          COUNT=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -n "$INNER" ]; then
            mv "$INNER"/* /tmp/extracted/
          fi
          cp -r /tmp/extracted/. .
          rm -f "$ZIP_FILE"

      - name: Commit extracted files back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Auto-extract project zip" || echo "Tidak ada perubahan"
          git push
